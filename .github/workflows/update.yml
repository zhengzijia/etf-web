name: Update web data

on:
  schedule:
    - cron: "30 23 * * 0-5"  # 北京时间 07:30 = UTC 23:30（前一自然日），周一至周六；深市份额~07:00 发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests openpyxl
      - uses: actions/cache@v4
        with:
          path: cache
          key: web-cache-v2-${{ github.run_id }}
          restore-keys: web-cache-v2-
      - run: python build_data.py
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update data $(date -u +%F)"
          git push
