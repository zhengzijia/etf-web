name: Update web data

on:
  schedule:
    - cron: "30 14 * * 1-5"  # 22:30 CST（收盘后，周一到周五）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests openpyxl
      - uses: actions/cache@v4
        with:
          path: cache
          key: web-cache-${{ github.run_id }}
          restore-keys: web-cache-
      - run: python build_data.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update data $(date -u +%F)"
          git push
